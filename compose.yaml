services:
  # Base de Datos Vectorial (PostgreSQL 16 + pgvector)
  db:
    image: docker.io/pgvector/pgvector:pg16
    container_name: helpdesk_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: helpdesk_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d helpdesk_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - helpdesk_net

  # Administrador visual de Base de Datos (pgAdmin 4)
  pgadmin:
    image: docker.io/dpage/pgadmin4:latest
    container_name: helpdesk_pgadmin
    user: root
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@helpdesk.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - helpdesk_net

  # Backend API (FastAPI + Python 3.12)
  backend:
    build:
      context: ./backend-fastapi
      dockerfile: Containerfile
    container_name: helpdesk_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/helpdesk_ai
      AI_API_KEY: ${AI_API_KEY:-tu_api_key_aqui}
    volumes:
      - ./backend-fastapi:/app:Z
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - helpdesk_net

  # Frontend SSR (Next.js App Router)
  frontend:
    build:
      context: ./frontend-next
      dockerfile: Containerfile
    container_name: helpdesk_frontend
    restart: unless-stopped
    environment:
      # URL interna para cuando Next.js hace Server-Side Rendering (SSR) dentro de Podman
      INTERNAL_API_URL: http://backend:8000/api/v1
      # URL pública para peticiones desde el navegador del cliente (pasa por Nginx)
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
      WATCHPACK_POLLING: "true" # Necesario en Windows para detectar cambios en vivo
    volumes:
      - ./frontend-next:/app:Z
      - /app/node_modules
      - /app/.next
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - helpdesk_net

  # Reverse Proxy (Nginx)
  nginx:
    image: docker.io/library/nginx:alpine
    container_name: helpdesk_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
    depends_on:
      - backend
      - frontend
    networks:
      - helpdesk_net

volumes:
  postgres_data:
  pgadmin_data:

networks:
  helpdesk_net:
    driver: bridge
